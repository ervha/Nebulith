name: Deploy Nebulith Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Studio
        run: |
          python tools/build_web_studio.py

      - name: Verify Web Studio
        run: |
          node tests/verify_studio.js
          node tests/verify_productive_translation.js
          node tests/verify_sprint1_modals_and_conditions.js
          node tests/verify_sprint2_comparison_and_quotes.js
          node tests/verify_sprint3_lexicon_and_adverbs.js

      - name: Prepare Pages Artifact
        run: |
          mkdir -p dist
          cp -r web/* dist/
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
