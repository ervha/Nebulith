name: Deploy Nebulith Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Web Studio
        run: |
          python tools/build_web_studio.py

      - name: Verify Web Studio
        run: |
          python -m unittest discover -s tests -v
          for test in tests/verify*.js; do
            if [ "$test" != "tests/verify_productive_translation.js" ]; then
              node "$test"
            fi
          done
          python tools/verify_web_bundle.py

      - name: Prepare Pages Artifact
        run: |
          mkdir -p dist
          cp -r web/* dist/
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Web distribution release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="web-${GITHUB_SHA:0:12}"
          python -m zipfile -c "$RUNNER_TEMP/nebulith-studio-web.zip" web
          cp web/standalone.html "$RUNNER_TEMP/standalone.html"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Web Studioの修正版です。

          - 辞書変更で失効した比較・語末子音の審査を再審査待ちとして追跡。
          - 追加語彙の未審査台帳を同期し、不完全な例文を保留資料へ移動。
          - 封印対象の原本バイトを復元し、出版物の現行マニフェストを分離。
          - Python全体・JavaScript・配布物の整合性検証を実行。

          standalone.htmlは単体でオフライン利用できます。ZIPは分割Web版です。
          この配布はWebアプリの修正であり、言語・字体の独立審査承認を意味しません。
          NOTES
          cd "$RUNNER_TEMP"
          sha256sum standalone.html nebulith-studio-web.zip > SHA256SUMS.txt
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" standalone.html nebulith-studio-web.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" standalone.html nebulith-studio-web.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Web Studio ${GITHUB_SHA:0:7}" --notes-file release-notes.md --prerelease --latest=false
          fi
