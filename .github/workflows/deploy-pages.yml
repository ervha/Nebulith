name: Deploy Nebulith Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Studio
        run: |
          python tools/build_web_studio.py

      - name: Verify Web Studio
        run: |
          for test in tests/verify*.js; do
            node "$test"
          done
          python -m unittest discover -s tests -p test_service_worker.py -v
          python tools/verify_web_bundle.py

      - name: Prepare Pages Artifact
        run: |
          mkdir -p dist
          cp -r web/* dist/
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Web distribution release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="web-${GITHUB_SHA:0:12}"
          python -m zipfile -c "$RUNNER_TEMP/nebulith-studio-web.zip" web
          cp web/standalone.html "$RUNNER_TEMP/standalone.html"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Web Studioの修正版です。

          - 英語入力の否定・主語・目的語を保持し、未知語を省略した確定訳を防止。
          - 未知の引用話者を安全に保留し、引用内の解釈選択・確認と未対応記録を修正。
          - 配布物の内容に応じたPWAキャッシュ更新とオフライン代替表示を修正。
          - 全JavaScript検証、キャッシュ更新テスト、配布物整合性検証を実行。

          standalone.htmlは単体でオフライン利用できます。ZIPは分割Web版です。
          この配布はWebアプリの修正であり、言語・字体の独立審査承認を意味しません。
          NOTES
          cd "$RUNNER_TEMP"
          sha256sum standalone.html nebulith-studio-web.zip > SHA256SUMS.txt
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" standalone.html nebulith-studio-web.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" standalone.html nebulith-studio-web.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Web Studio ${GITHUB_SHA:0:7}" --notes-file release-notes.md --prerelease --latest=false
          fi
