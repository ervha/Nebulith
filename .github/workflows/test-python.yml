name: Validate Python repair

on:
  push:
    branches:
      - codex/fix-python-20261018
  pull_request:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_web_studio.py
      - name: Verify all tests
        run: |
          python -m unittest discover -s tests -v
          for test in tests/verify*.js; do
            if [ "$test" != "tests/verify_productive_translation.js" ]; then
              node "$test"
            fi
          done
          python tools/verify_web_bundle.py
